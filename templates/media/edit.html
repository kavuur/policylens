{% extends "media/base.html" %}

{% block media_content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold">Edit Media</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('edit_media', media_id=media.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

                    <div class="mb-3">
                        <label for="filename" class="form-label">Filename</label>
                        <input type="text" class="form-control" id="filename" name="filename"
                            value="{{ media.filename }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description"
                            rows="3">{{ media.description }}</textarea>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="category" class="form-label">Category</label>
                            <select class="form-select" id="category" name="category">
                                <option value="">Select Category</option>
                                {% for key, label in media.CATEGORIES %}
                                <option value="{{ key }}" {% if media.category==key %}selected{% endif %}>{{ label }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="visibility" class="form-label">Visibility</label>
                            <select class="form-select" id="visibility" name="visibility">
                                {% for key, label in media.VISIBILITY %}
                                <option value="{{ key }}" {% if media.visibility==key %}selected{% endif %}>{{ label }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label d-flex justify-content-between align-items-center">
                            <span>Descriptors</span>
                            <button type="button" class="btn btn-sm btn-outline-primary" id="addDescriptorBtn">
                                <i class="fas fa-plus me-1"></i> Add
                            </button>
                        </label>
                        <div id="descriptorsContainer">
                            {% for descriptor in media.descriptors %}
                            <div class="input-group mb-2 descriptor-row">
                                <input type="text" class="form-control" name="descriptor_key_{{ loop.index0 }}"
                                    placeholder="Key (e.g., Year)" value="{{ descriptor.key }}" required>
                                <input type="text" class="form-control" name="descriptor_value_{{ loop.index0 }}"
                                    placeholder="Value (e.g., 2023)" value="{{ descriptor.value }}" required>
                                <button type="button" class="btn btn-outline-danger remove-descriptor">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('view_media', media_id=media.id) }}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const container = document.getElementById('descriptorsContainer');
        const addBtn = document.getElementById('addDescriptorBtn');
        let descriptorCount = {{ media.descriptors| length
    }};

    addBtn.addEventListener('click', function () {
        const row = document.createElement('div');
        row.className = 'input-group mb-2 descriptor-row';
        row.innerHTML = `
                <input type="text" class="form-control" name="descriptor_key_${descriptorCount}" placeholder="Key (e.g., Year)" required>
                <input type="text" class="form-control" name="descriptor_value_${descriptorCount}" placeholder="Value (e.g., 2023)" required>
                <button type="button" class="btn btn-outline-danger remove-descriptor">
                    <i class="fas fa-times"></i>
                </button>
            `;
        container.appendChild(row);
        descriptorCount++;
    });

    container.addEventListener('click', function (e) {
        if (e.target.closest('.remove-descriptor')) {
            e.target.closest('.descriptor-row').remove();
        }
    });
    });
</script>
{% endblock %}
